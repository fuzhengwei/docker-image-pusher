name: Docker Images Aliyun

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            # 解析 --platform 参数（默认 linux/amd64）
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            pull_platform="$platform"
            if [ -z "$pull_platform" ]; then
                pull_platform="linux/amd64"
            fi
            pull_os="${pull_platform%%/*}"
            pull_arch="${pull_platform#*/}"
            image=$(echo "$line" | awk '{print $NF}')

            # 先解析目标平台的单平台 manifest digest 再按 digest 拉取：
            # containerd 镜像存储下 docker pull（即使带 --platform）也会保留整个 OCI index
            # （多架构 + attestation manifest），tag+push 会把 index 原样推到阿里云，
            # 导致一个 tag 下出现多个 digest，且控制台无法统计镜像大小（显示 "-"）
            digest=$(docker manifest inspect "$image" 2>/dev/null | jq -r --arg os "$pull_os" --arg arch "$pull_arch" '(.manifests[]? | select(.platform.os == $os and .platform.architecture == $arch) | .digest) // empty' | head -n1)

            if [ -n "$digest" ]; then
                echo "resolved single manifest: $image@$digest"
                docker pull "$image@$digest"
                local_ref="$image@$digest"
            else
                echo "source is a single manifest, docker pull --platform $pull_platform $image"
                docker pull --platform "$pull_platform" "$image"
                local_ref="$image"
            fi
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            latest_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name:latest"
            
            echo "docker tag $local_ref $new_image"
            docker tag "$local_ref" "$new_image"
            echo "docker push $new_image"
            docker push $new_image

            echo "docker tag $local_ref $latest_image"
            docker tag "$local_ref" "$latest_image"
            echo "docker push $latest_image"
            docker push $latest_image

            # 自检：确认推送的是单 manifest，否则 ACR 镜像大小会显示 "-"
            pushed_media=$(docker manifest inspect "$new_image" 2>/dev/null | jq -r '.mediaType // ""')
            echo "pushed $new_image mediaType: $pushed_media"
            if [[ "$pushed_media" == *"index"* || "$pushed_media" == *"manifest.list"* ]]; then
                echo "::error::pushed image $new_image is still a multi-manifest index"
                exit 1
            fi
                    
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            
            df -hT
            echo "=============================================================================="
            docker rmi "$local_ref"
            docker rmi "$new_image"
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="     
            
        done < images.txt
